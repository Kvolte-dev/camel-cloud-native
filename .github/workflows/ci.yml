name: Cloud-Native CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  java-build-and-test:
    name: Java 25 Build & Camel Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Run unit & Camel AdviceWith tests
        run: mvn test -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/target/surefire-reports/

  helm-and-security-audit:
    name: Helm Lint & Trivy Config Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint & render Helm chart
        run: |
          helm lint charts/camel-app
          helm template camel-app charts/camel-app > /dev/null

      - name: Trivy IaC/Helm misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: charts/camel-app
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  docker-build-and-trivy-scan:
    name: Docker Build & Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [ java-build-and-test, helm-and-security-audit ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build hardened Docker image
        run: docker build -t camel-app:ci ./app

      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: camel-app:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL