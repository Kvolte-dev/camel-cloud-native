name: Cloud-Native CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  java-build-and-test:
    name: Java 25 Build & Camel Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Run unit & Camel AdviceWith tests
        run: mvn test -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/target/surefire-reports/

  helm-and-security-audit:
    name: Helm Lint & Trivy Config Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint & render Helm chart
        run: |
          helm lint charts/camel-app
          helm template camel-app charts/camel-app > /dev/null

      - name: Trivy IaC/Helm misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: charts/camel-app
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate
        run: |
          terraform init -backend=false
          terraform validate

  docker-build-and-publish:
    name: Docker Build, Trivy Scan & GHCR Publish
    runs-on: ubuntu-latest
    needs: [ java-build-and-test, helm-and-security-audit, terraform-validate ]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define image metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image=ghcr.io/${OWNER}/camel-app" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build hardened Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${{ steps.meta.outputs.image }}:main" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
            ./app

      - name: Trivy container vulnerability scan (blocking before push)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push verified image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.meta.outputs.image }}:main"
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}"