apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apicurio-registry
  template:
    metadata:
      labels:
        app: apicurio-registry
    spec:
      containers:
        - name: apicurio-registry
          image: quay.io/apicurio/apicurio-registry:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /apis/registry/v3/system/info
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio-registry
  namespace: messaging
spec:
  selector:
    app: apicurio-registry
  ports:
    - name: http
      port: 8080
      targetPort: 8080