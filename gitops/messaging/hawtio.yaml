apiVersion: apps/v1
kind: Deployment
metadata:
  name: hawtio
  namespace: messaging
  labels:
    app: hawtio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hawtio
  template:
    metadata:
      labels:
        app: hawtio
    spec:
      securityContext:
        fsGroup: 100
      initContainers:
        - name: download-hawtio
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - curl -fsSL https://repo1.maven.org/maven2/io/hawt/hawtio-app/2.17.7/hawtio-app-2.17.7.jar -o /hawtio/hawtio-app.jar
          volumeMounts:
            - name: hawtio-bin
              mountPath: /hawtio
      containers:
        - name: hawtio
          image: eclipse-temurin:21-jre-alpine
          command:
            - java
            - -Dhawtio.authenticationEnabled=false
            - -Dhawtio.proxyAllowlist=activemq,activemq.messaging.svc.cluster.local
            - -jar
            - /hawtio/hawtio-app.jar
            - --port
            - "8080"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: hawtio-bin
              mountPath: /hawtio
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: hawtio-bin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hawtio
  namespace: messaging
  labels:
    app: hawtio
spec:
  selector:
    app: hawtio
  ports:
    - name: http
      port: 8080
      targetPort: 8080