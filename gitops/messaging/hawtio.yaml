apiVersion: apps/v1
kind: Deployment
metadata:
  name: hawtio
  namespace: messaging
  labels:
    app: hawtio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hawtio
  template:
    metadata:
      labels:
        app: hawtio
    spec:
      containers:
        - name: hawtio
          image: hawtio/hawtio:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HAWTIO_AUTHENTICATION_ENABLED
              value: "false"
            - name: HAWTIO_PROXY_ALLOWLIST
              value: "activemq,activemq.messaging.svc.cluster.local"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hawtio
  namespace: messaging
  labels:
    app: hawtio
spec:
  selector:
    app: hawtio
  ports:
    - name: http
      port: 8080
      targetPort: 8080