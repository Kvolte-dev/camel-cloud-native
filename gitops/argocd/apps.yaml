---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: camel-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<TON-USER>/camel-cloud-native.git
    targetRevision: main
    path: charts/camel-app
    helm:
      releaseName: camel-app
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true