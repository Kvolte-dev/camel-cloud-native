apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: messaging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<TON-USER>/camel-cloud-native.git
    targetRevision: main
    path: gitops/messaging
  destination:
    server: https://kubernetes.default.svc
    namespace: messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
