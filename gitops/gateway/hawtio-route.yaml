apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hawtio-route
  namespace: messaging
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - "hawtio.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hawtio
          port: 8080