apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hawtio-route
  namespace: messaging
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "hawtio.localhost"
  rules:
    - backendRefs:
        - name: hawtio
          port: 8080