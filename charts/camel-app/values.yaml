image:
  repository: camel-app
  tag: "1.0.1"
  pullPolicy: IfNotPresent

service:
  port: 8080

env:
  ACTIVEMQ_URL: "tcp://activemq.messaging.svc.cluster.local:61616"
  KAFKA_BROKERS: "local-kafka-kafka-bootstrap.messaging.svc.cluster.local:9092"
  OLLAMA_URL: "http://host.docker.internal:11434"
  OLLAMA_MODEL: "llama3.1:8b"
  OTEL_ENABLED: "true"
  PROCESSING_DELAY_MS: "100"

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 10
  cooldownPeriod: 30
  lagThreshold: "5"
  consumerGroup: "local-processor"
  topic: "orders.process"